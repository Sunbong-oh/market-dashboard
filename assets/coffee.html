<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>커피 쿠폰 받기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--y:#F2A900;--yl:#FBE7B0;--ink:#3D3A35;--bg:#FAF8F3;--sub:#6B665D;--line:#E6E0D2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:16px;line-height:1.55}
.bar{height:8px;background:var(--y)}
main{max-width:440px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:24px;margin:0 0 6px;padding-left:12px;border-left:6px solid var(--y);line-height:1.3}
.sub{color:var(--sub);font-size:14px;margin:0 0 22px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--y);border-color:var(--y)}
button,.btn{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:8px;background:var(--y);color:var(--ink);font:inherit;font-weight:700;font-size:17px;text-align:center;text-decoration:none;cursor:pointer}
button.ghost{background:#fff;border:1px solid var(--line);font-weight:500;font-size:15px;margin-top:10px}
.err{color:#C0392B;font-size:14px;margin-top:10px;min-height:1em}
.note{color:var(--sub);font-size:13px;margin-top:16px}
.box{background:var(--yl);border-radius:8px;padding:12px;font-size:15px;word-break:break-all;margin-top:12px}
#qr{display:flex;justify-content:center;margin:14px 0 4px}
#qr img,#qr canvas{background:#fff;padding:8px;border-radius:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="bar"></div>
<main>

<!-- 링크 만들기 (받는 분 번호가 없는 주소로 열었을 때) -->
<section id="setup" hidden>
  <h1>커피 쿠폰 링크 만들기</h1>
  <p class="sub">쿠폰을 보내실 분(받는 문자)의 번호를 넣으면, 동료에게 돌릴 링크가 만들어집니다.</p>
  <div class="card">
    <label for="sTo">문자를 받을 번호</label>
    <input id="sTo" type="tel" inputmode="numeric" placeholder="010-1234-5678" autocomplete="off">
    <label for="sName">받는 분 호칭 (선택)</label>
    <input id="sName" type="text" placeholder="예: 부장님" maxlength="12">
    <button id="sMake" type="button">링크 만들기</button>
    <div class="err" id="sErr"></div>
    <div id="sOut" hidden>
      <div class="box" id="sLink"></div>
      <button id="sCopy" type="button">링크 복사</button>
    </div>
  </div>
  <p class="note">번호는 링크 주소 안에만 들어가고, 이 페이지나 서버에는 저장되지 않습니다.</p>
</section>

<!-- 동료가 쓰는 화면 -->
<section id="form" hidden>
  <h1>☕ <span id="who">부장님</span>이 커피 쏘십니다</h1>
  <p class="sub">이름과 휴대폰번호를 적고 버튼을 누르면 문자 창이 열립니다. 문자를 <b>보내기</b>까지 눌러 주세요.</p>

  <div class="card" id="pc" hidden>
    <b>휴대폰으로 열어 주세요</b>
    <div class="sub" style="margin:4px 0 0">문자는 휴대폰에서만 보낼 수 있습니다. 카메라로 아래 QR을 찍으면 이 화면이 열립니다.</div>
    <div id="qr"></div>
  </div>

  <div class="card" style="margin-top:14px">
    <label for="fName">이름</label>
    <input id="fName" type="text" placeholder="홍길동" maxlength="20" autocomplete="name">
    <label for="fTel">휴대폰번호</label>
    <input id="fTel" type="tel" inputmode="numeric" placeholder="010-1234-5678" autocomplete="tel">
    <label for="fMenu">메뉴 (선택)</label>
    <select id="fMenu">
      <option value="">상관없음</option>
      <option>아이스 아메리카노</option>
      <option>따뜻한 아메리카노</option>
      <option>카페라떼</option>
    </select>
    <button id="fSend" type="button">문자 보내기</button>
    <button id="fCopy" class="ghost" type="button">문자 내용만 복사</button>
    <div class="err" id="fErr"></div>
  </div>
  <p class="note">적은 내용은 내 휴대폰의 문자로만 전달됩니다. 이 페이지는 아무것도 저장하지 않습니다.</p>
</section>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var digits=function(s){return (s||'').replace(/\D/g,'')};
  var okTel=function(d){return /^01[016789]\d{7,8}$/.test(d)};
  var fmt=function(d){return d.length===11?d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7):d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6)};
  var p=new URLSearchParams(location.hash.replace(/^#/,''));
  var to=digits(p.get('to')), who=(p.get('n')||'').slice(0,12);

  function copy(text,btn,done){
    var ok=function(){var t=btn.textContent;btn.textContent=done;setTimeout(function(){btn.textContent=t},1500)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,function(){prompt('복사해 주세요',text)})}
    else prompt('복사해 주세요',text);
  }

  if(!okTel(to)){
    $('setup').hidden=false;
    var link='';
    $('sMake').onclick=function(){
      var d=digits($('sTo').value);
      if(!okTel(d)){$('sErr').textContent='휴대폰번호를 다시 확인해 주세요.';$('sOut').hidden=true;return}
      $('sErr').textContent='';
      var q=new URLSearchParams({to:d});var n=$('sName').value.trim();if(n)q.set('n',n);
      link=location.href.split('#')[0]+'#'+q.toString();
      $('sLink').textContent=link;$('sOut').hidden=false;
    };
    $('sCopy').onclick=function(){copy(link,this,'복사했습니다')};
    return;
  }

  $('form').hidden=false;
  if(who)$('who').textContent=who;
  var mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(!mobile){
    $('pc').hidden=false;
    try{new QRCode($('qr'),{text:location.href,width:180,height:180,correctLevel:QRCode.CorrectLevel.M})}
    catch(e){$('qr').textContent='이 주소를 휴대폰으로 보내서 열어 주세요.'}
  }
  function body(){
    var name=$('fName').value.trim(), d=digits($('fTel').value);
    if(!name){$('fErr').textContent='이름을 적어 주세요.';return null}
    if(!okTel(d)){$('fErr').textContent='휴대폰번호를 다시 확인해 주세요.';return null}
    $('fErr').textContent='';
    var m=$('fMenu').value;
    return '[커피 쿠폰] '+name+' / '+fmt(d)+(m?' / '+m:'');
  }
  $('fSend').onclick=function(){
    var b=body();if(!b)return;
    var ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
    location.href='sms:'+to+(ios?'&':'?')+'body='+encodeURIComponent(b);
  };
  $('fCopy').onclick=function(){var b=body();if(b)copy(b,this,'복사했습니다')};
})();
</script>
</body>
</html>
