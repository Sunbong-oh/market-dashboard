name: Earnings Flash Telegram

# 실적 속보 카드(earnings_flash/*.json)가 main 에 새로 올라오거나 고쳐지면 홈페이지 카드 모양 이미지로 텔레그램에 보낸다.
# (홈페이지 반영은 site.yml 이 같은 push 로 따로 한다)
on:
  push:
    branches: [main]
    paths: ["earnings_flash/**"]
  workflow_dispatch:
    inputs:
      file:
        description: 보낼 카드 경로 (예 earnings_flash/20261015-TSMC.json)
        required: true

permissions:
  contents: read

concurrency:
  group: earnings-flash
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 카드 이미지 준비 (한글·이모지 글꼴, Playwright)
        # 러너에 깔린 Chrome 을 쓴다. 준비가 실패해도 다음 단계가 글로 보낸다.
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji > /dev/null
          pip install -q playwright
          echo "CHROME_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: 카드 텔레그램 발송
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FILE: ${{ inputs.file }}
        run: |
          if [ -n "$FILE" ]; then python earnings_notify.py "$FILE"
          else python earnings_notify.py --diff "$BEFORE" "$AFTER"; fi
