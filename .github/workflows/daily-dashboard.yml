name: Daily Market Dashboard

on:
  schedule:
    # 정각(:00)은 GitHub 서버가 붐벼 예약 실행이 누락되기 쉬워 일부러 어긋난 분으로 둔다
    - cron: "37 21 * * *"  # 매일 06:37 KST (UTC 21:37)
  workflow_dispatch:        # Actions 탭에서 수동 실행

jobs:
  send:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dashboard and send to Telegram
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python dashboard.py --notify --no-open
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard
          path: |
            dashboard.html
            dashboard.png
          if-no-files-found: ignore
