name: Daily Market Dashboard

on:
  # 주 실행 경로: Claude 루틴이 화~토 06:55 KST에 trigger/ 아래 파일을 커밋해 push로 깨운다.
  # (GitHub 자체 schedule은 이 저장소에서 1.5~3시간씩 늦게 돌아 7시 발송에 쓸 수 없었다.)
  push:
    branches: [main, "claude/**"]
    paths: ["trigger/**"]
  schedule:
    # 예비: 루틴이 실패한 날을 위한 GitHub 자체 예약. 한국 화~토 아침 = UTC 월~금 밤.
    # 이미 보냈으면 아래 gate가 건너뛴다.
    - cron: "7 22 * * 1-5"    # 07:07 KST
    - cron: "37 22 * * 1-5"   # 07:37 KST
  workflow_dispatch:        # Actions 탭에서 수동 실행(항상 만든다)
    inputs:
      telegram:
        description: 텔레그램으로도 보내기 (끄면 웹사이트용으로만 만든다)
        type: boolean
        default: true

permissions:
  contents: write   # 웹사이트용 archive/daily/ 저장
  actions: read

# 여러 실행이 겹쳐도 차례로 돌게 해서, 뒤엣것이 "이미 보냄"을 볼 수 있게 한다
concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  send:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Decide whether to send (once per morning)
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          send=1; why="manual run"
          if [ "$EVENT" = "push" ] || [ "$EVENT" = "schedule" ]; then
            hour=$((10#$(date -u +%H)))
            # 아침 창의 시작: 가장 최근의 05:00 KST(= 20:00 UTC)
            if [ "$hour" -ge 20 ]; then ws=$(date -u +%Y-%m-%dT20:00:00Z); else ws=$(date -u -d 'yesterday' +%Y-%m-%dT20:00:00Z); fi
            # 그 사이 실행 중 '실제로 발송 단계를 마친' 것만 센다. 발송하지 않고 끝난 실행(다른 브랜치 push 등)까지
            # 세면 진짜 아침 트리거가 '이미 보냄'으로 막힌다(2026-10-21 아침 누락).
            ids=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-dashboard.yml/runs?created=>$ws&per_page=50" \
                --jq ".workflow_runs[] | select(.event==\"schedule\" or .event==\"push\") | select(.id != ${{ github.run_id }}) | .id")
            n=0
            for id in $ids; do
              c=$(gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
                  --jq '[.jobs[].steps[]? | select(.name=="Build dashboard and send to Telegram" and .conclusion=="success")] | length')
              [ "$c" != "0" ] && n=$((n+1))
            done
            why="first run since $ws"
            if [ "$n" != "0" ]; then send=0; why="already sent this morning ($n sent run since $ws)"; fi
            # 예비 예약이 정오(KST) 넘어 뒤늦게 돌면 보내지 않는다
            if [ "$EVENT" = "schedule" ] && [ "$hour" -ge 3 ] && [ "$hour" -lt 20 ]; then send=0; why="scheduled run started too late (UTC hour $hour)"; fi
            # push는 아침 루틴의 트리거 커밋('trigger: ...')만 발송한다. 다른 작업 브랜치를 새로 올리면
            # main과의 차이에 trigger/ 파일이 잡혀 이 워크플로가 깨어나는데(2026-10-19 16:21 오발송), 그건 무시한다.
            if [ "$EVENT" = "push" ]; then
              case "$COMMIT_MSG" in trigger:*) ;; *) send=0; why="push is not a trigger commit";; esac
              # 트리거 커밋이라도 아침(05:00~12:00 KST = 20:00~03:00 UTC)을 벗어나면 보내지 않는다
              if [ "$hour" -ge 3 ] && [ "$hour" -lt 20 ]; then send=0; why="push outside the morning window (UTC hour $hour)"; fi
            fi
            case "$COMMIT_MSG" in *"[test]"*) send=1; why="[test] push";; esac
          fi
          echo "send=$send ($why)"
          echo "send=$send" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.send == '1'
        with:
          # 트리거 커밋이 어느 브랜치에 오든 최신 main의 dashboard.py로 만든다.
          # 단, 커밋 메시지에 [test]가 있으면 그 커밋의 코드로 만든다(PR 브랜치 변경을 실제 발송으로 확인할 때).
          ref: ${{ contains(github.event.head_commit.message, '[test]') && github.sha || 'main' }}
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.send == '1'
        with:
          python-version: "3.12"
      - name: Build dashboard and send to Telegram
        if: steps.gate.outputs.send == '1'
        env:
          PYTHONIOENCODING: utf-8
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 주의: GitHub 식의 'A && '' || B'는 ''가 거짓으로 취급돼 항상 B가 된다. 그래서 빈 값 대신 '--no-telegram'을 넘긴다.
        run: python dashboard.py ${{ (github.event_name == 'workflow_dispatch' && !inputs.telegram) && '--no-telegram' || '--notify' }} --no-open
      - name: Save to website archive (archive/daily/YYYY-MM-DD)
        # 웹사이트(site.yml)가 이 기록으로 '오전 데일리' 메뉴를 만든다. 실패해도 텔레그램 발송에는 영향 없음.
        if: steps.gate.outputs.send == '1'
        continue-on-error: true
        shell: bash
        run: |
          day=$(date -u -d '+9 hours' +%Y-%m-%d)
          dest="archive/daily/$day"
          mkdir -p "$dest"
          cp dashboard.html "$dest/index.html"
          [ -f newhighs.html ] && cp newhighs.html "$dest/newhighs.html"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$dest"
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "daily: archive $day for website"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
      - name: 출근길 음성 브리핑 (MP3 + 팟캐스트 피드 -> podcast 브랜치)
        # briefing.json(위 dashboard.py가 남김)을 5분 안팎 음성으로 만들어 podcast 브랜치에 최근 14회차만 둔다.
        # 브랜치는 매번 커밋 하나로 덮어써(force push) MP3가 저장소 기록에 쌓이지 않게 한다.
        # 사이트(site.yml)가 이 브랜치를 /podcast/ 로 붙여 배포하고, 휴대폰 팟캐스트 앱이 feed.xml을 구독한다.
        # 실패해도 데일리 발송·사이트에는 영향 없음.
        if: steps.gate.outputs.send == '1'
        continue-on-error: true
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          # 내 목소리(선택): 둘 다 있으면 ElevenLabs 복제 음성, 없으면 기본 음성
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          pip install -q edge-tts
          mkdir -p _pod
          if git fetch --depth 1 origin podcast; then git archive FETCH_HEAD | tar -x -C _pod; fi
          python briefing.py --pod _pod
          day=$(date -u -d '+9 hours' +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/podcast.index"
          rm -f "$GIT_INDEX_FILE"
          git --work-tree=_pod add -A -f .
          commit=$(git commit-tree "$(git write-tree)" -m "podcast: $day")
          git push --force origin "$commit:refs/heads/podcast"
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.send == '1'
        with:
          name: dashboard
          path: |
            dashboard.html
            dashboard.png
            dashboard_*.png
            theme_news.html
            newhighs*.html
            newhighs_*.png
            briefing.txt
            briefing.mp3
          if-no-files-found: ignore
