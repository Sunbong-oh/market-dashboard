name: Website

# 나만의 주식투자 사이트(GitHub Pages) 빌드·배포.
#   - 오전 데일리: daily-dashboard.yml이 끝나면(workflow_run) 바로 다시 배포
#   - 돈이 되는 뉴스: 아래 schedule마다 새로 수집 (KST 08:20 ~ 22:20, 2시간 간격)
#   - 목표주가 변동: kb-market-report 저장소의 consensus/ (평일 08:00 작성) → Claude 루틴이 평일 08:17에
#     trigger-site/request.txt 를 push 해 08:20 전후 반영 (아래 08:20 예약은 예비)
#   - 장마감 리포트: kb-market-report 저장소의 archive/ 를 읽는다 (비공개면 Secret CLOSE_REPO_TOKEN 필요).
#     장마감(15:50~16:10 발송)은 16:12·16:20·16:35 예약 실행에서 반영된다. 그 전에는 화면이 flow-live 마지막 스냅샷을 보여 준다.
on:
  workflow_run:
    workflows: ["Daily Market Dashboard"]
    types: [completed]
  push:
    branches: [main]
    paths: ["build_site.py", "dashboard.py", "market_calendar.json", "theme_news/**", "archive/theme/**", "watchlist/**", ".github/workflows/site.yml", "trigger-site/**", "earnings_flash/**", "company_ko.py"]
  schedule:
    - cron: "20 23,1,3,5,7,9,11,13 * * *"
    - cron: "12 7 * * 1-5"   # 16:12 KST 장마감 리포트(15:50~16:05) 반영
    - cron: "35 7 * * 1-5"   # 16:35 KST 예비
  repository_dispatch:
    types: [close-report]   # 장마감 워크플로가 끝날 때 불러 주면 바로 반영(선택)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 방금 저장된 archive/daily 까지 포함한 최신 main
      - name: 장마감 리포트 저장소(kb-market-report) 가져오기
        # 비공개 저장소면 Secret CLOSE_REPO_TOKEN 필요. 공개 저장소면 토큰 없이도 읽힌다.
        # 실패해도 나머지 메뉴(데일리·뉴스)는 배포한다.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Sunbong-oh/kb-market-report
          token: ${{ secrets.CLOSE_REPO_TOKEN || github.token }}
          path: _close
          sparse-checkout: |
            archive
            consensus
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 해외주식 리포트 (us-reports 브랜치 저장본)
        # us-live 작업이 평일 08:40·21:00에 모아 us-reports 브랜치에 저장한 us_reports/*.json 을 쓴다
        # (해외주식 메뉴는 그 두 시각에만 바뀜). 브랜치가 없을 때만 직접 모은다. 실패해도 나머지 메뉴는 배포한다.
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if git fetch -q --depth 1 origin us-reports; then
            mkdir -p us_reports && git --work-tree=us_reports checkout FETCH_HEAD -- . && ls us_reports | tail -3
          else
            python us_reports.py --days 10
          fi
      - name: 사이트 생성
        env:
          PYTHONIOENCODING: utf-8
          CLOSE_REPO: ${{ github.workspace }}/_close
        run: python build_site.py
      - name: 출근길 음성 브리핑 붙이기 (podcast 브랜치 -> /podcast/feed.xml)
        # daily-dashboard.yml이 만든 MP3·피드. 브랜치가 아직 없거나 실패해도 나머지는 배포한다.
        continue-on-error: true
        run: |
          git fetch --depth 1 origin podcast
          mkdir -p _site/podcast
          git archive FETCH_HEAD | tar -x -C _site/podcast
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
